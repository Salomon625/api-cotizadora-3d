<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Admin Cotizadora 3D</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; background: #f6f7f9; color: #1f2937; }
    h1, h2 { margin-bottom: 12px; }
    table { width: 100%; border-collapse: collapse; background: white; margin-bottom: 24px; }
    th, td { border: 1px solid #d1d5db; padding: 8px; font-size: 14px; }
    th { background: #e5e7eb; text-align: left; }
    input { width: 100%; box-sizing: border-box; border: 1px solid #cbd5e1; padding: 6px; }
    button { background: #111827; color: white; border: 0; padding: 10px 16px; cursor: pointer; }
    .ok { color: #047857; margin-left: 12px; }
  </style>
</head>
<body>
  <h1>Panel Admin Cotizadora 3D</h1>

  <h2>Configuracion general</h2>
  <table id="general"></table>

  <h2>Materiales</h2>
  <table id="materiales"></table>

  <button onclick="guardar()">Guardar cambios</button>
  <span id="estado" class="ok"></span>

  <script>
    let config = null;

    async function cargar() {
      const respuesta = await fetch("/api/config");
      config = await respuesta.json();
      pintarGeneral();
      pintarMateriales();
    }

    function pintarGeneral() {
      const tabla = document.getElementById("general");
      tabla.innerHTML = "<tr><th>Campo</th><th>Valor</th></tr>";

      for (const [clave, valor] of Object.entries(config.general)) {
        tabla.innerHTML += `
          <tr>
            <td>${clave}</td>
            <td><input value="${valor}" onchange="config.general['${clave}'] = Number(this.value)"></td>
          </tr>
        `;
      }
    }

    function pintarMateriales() {
      const tabla = document.getElementById("materiales");
      tabla.innerHTML = `
        <tr>
          <th>Codigo</th>
          <th>Nombre</th>
          <th>Precio kg</th>
          <th>Densidad</th>
          <th>Origen</th>
          <th>Colores separados por coma</th>
        </tr>
      `;

      for (const [codigo, material] of Object.entries(config.materiales)) {
        tabla.innerHTML += `
          <tr>
            <td>${codigo}</td>
            <td><input value="${material.nombre}" onchange="config.materiales['${codigo}'].nombre = this.value"></td>
            <td><input value="${material.precio_kg}" onchange="config.materiales['${codigo}'].precio_kg = Number(this.value)"></td>
            <td><input value="${material.densidad_g_cm3}" onchange="config.materiales['${codigo}'].densidad_g_cm3 = Number(this.value)"></td>
            <td><input value="${material.origen}" onchange="config.materiales['${codigo}'].origen = this.value"></td>
            <td><input value="${material.colores.join(', ')}" onchange="config.materiales['${codigo}'].colores = this.value.split(',').map(x => x.trim())"></td>
          </tr>
        `;
      }
    }

    async function guardar() {
      await fetch("/api/config", {
        method: "PUT",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(config)
      });

      document.getElementById("estado").textContent = "Guardado";
      setTimeout(() => document.getElementById("estado").textContent = "", 2000);
    }

    cargar();
  </script>
</body>
</html>
